name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  app:
    name: App (typecheck + bundle)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Bundle smoke test
        # Exercises Metro's module resolution over the whole app (catches import/export
        # mistakes that tsc alone won't, e.g. platform-conditional package exports).
        run: EXPO_OFFLINE=1 npx expo export --platform android

  functions:
    name: Cloud Functions (typecheck)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit
